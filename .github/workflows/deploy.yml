name: Deploy BodyAxis

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, bodyaxis]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create production env file
        run: |
          cat <<EOF > .env.production
          NODE_ENV=production
          PORT=5000
          DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/bodyaxis?schema=public
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN=7d
          JWT_REFRESH_EXPIRES_IN=30d
          EOF

      - name: Clean old containers
        run: |
          docker rm -f bodyaxis_redis bodyaxis_postgres bodyaxis_app bodyaxis_nginx || true

      - name: Deploy with Docker
        run: |
          export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          export REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

          docker-compose -f docker-compose.prod.yml down || true
          docker-compose -f docker-compose.prod.yml up -d --build

      - name: Show containers
        run: docker ps