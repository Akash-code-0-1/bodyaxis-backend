services:
  postgres:
    image: postgres:16
    container_name: bodyaxis_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bodyaxis
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bodyaxis_redis_dev
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_dev_data: