services:
  app:
    build: .
    container_name: bodyaxis_app
    restart: always
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.production
    expose:
      - "5000"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  postgres:
    image: postgres:16
    container_name: bodyaxis_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bodyaxis
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bodyaxis_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_prod_data:/data

  nginx:
    image: nginx:stable-alpine
    container_name: bodyaxis_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_prod_data:
  redis_prod_data: