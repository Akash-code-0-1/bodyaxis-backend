version: "3.9"

services:
  app:
    build: .
    container_name: bodyaxis_app
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate dev --name init && npm run dev"

  postgres:
    image: postgres:16
    container_name: bodyaxis_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bodyaxis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bodyaxis_redis
    restart: always
    ports:
      - "6379:6379"

  nginx:
    image: nginx:stable-alpine
    container_name: bodyaxis_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data: